name: Standards
on:
  push:
    branches: [main]
  pull_request:
jobs:
  readme:
    name: README structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README stays minimal (screenshot, title, description, docs menu, license)
        run: |
          if [ ! -f README.md ]; then
            echo "No README.md found."; exit 1
          fi
          bad=$(grep -E '^##[[:space:]]' README.md | sed -E 's/^##[[:space:]]+//' | grep -viE '^(docs|documentation|license)$' || true)
          if [ -n "$bad" ]; then
            echo "README.md has sections that belong in docs/*.md:"
            echo "$bad" | sed 's/^/  - /'
            echo
            echo "Allowed top-level (##) sections: Docs, License."
            echo "Move overview / motivation / usage / setup prose into docs/."
            exit 1
          fi
          echo "README structure OK."
